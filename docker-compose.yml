# Local testing and small installs: PostgreSQL + SIMRS in two containers.
# For the campus PostgreSQL server, run only the `app` service (or the image) with
# DATABASE_URL pointing at that server. See docs/operations/campus-deployment.md.
#
#   cp .env.example .env    # set JWT_SECRET and POSTGRES_PASSWORD
#   docker compose up -d --build
#   docker compose exec app node server/dist/cli.js bootstrap --admin-password '<strong password>' --class "Kelas RMIK"
#   open http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: simrs
      POSTGRES_USER: simrs_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simrs_owner -d simrs"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    environment:
      DATABASE_URL: postgres://simrs_owner:${POSTGRES_PASSWORD}@db:5432/simrs
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters)}
      MIGRATE_ON_START: "true"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
